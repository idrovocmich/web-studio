name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep this name: branch protection on main requires this exact check.
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build the starter with every fixture brand
        run: |
          for brand in packages/brand-contract/fixtures/*/; do
            WS_BRAND="$(basename "$brand")" pnpm --filter @idrovocmich/starter build
          done

      - name: Check published package contents
        run: |
          for pkg in tokens brand-contract; do
            (cd "packages/$pkg" && pnpm pack --dry-run)
          done
